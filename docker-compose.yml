# Production-like stack: PostgreSQL + one-off migration job + the app.
#
#   cp .env.docker.example .env.docker   # then edit the secrets
#   docker compose --env-file .env.docker up -d --build
#
# Real SMS is required here (SMS_PROVIDER=kavenegar); the on-screen test code
# only exists in development. To try the app locally with Docker, use
# docker-compose.dev.yml instead.

name: appointment-booking

services:
  db:
    image: ${REGISTRY:-}postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: migrator
      args:
        REGISTRY: ${REGISTRY:-}
    environment: &app-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-booking}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (at least 32 random characters)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-مدیر سامانه}
      SMS_PROVIDER: ${SMS_PROVIDER:-kavenegar}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_TEMPLATE: ${KAVENEGAR_TEMPLATE:-verify}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        REGISTRY: ${REGISTRY:-}
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
